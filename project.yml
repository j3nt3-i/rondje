name: WatchPlanner
options:
  bundleIdPrefix: nl.jente
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: YZV5DX4L6Y
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WatchPlanner:
    type: application
    platform: iOS
    sources: [WatchPlanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.jente.watchplanner
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Watch Planner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
